<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic OS</title>
<style>
  :root { --bg: #fbfaf8; --ink: #22201d; --dim: #6b655d; --line: #e4dfd8; --accent: #4f8f88; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1f1b18; --ink: #eee8e1; --dim: #a69d93; --line: #3a332d; --accent: #7fbcb4; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 56px 20px; }
  h1 { font-weight: 400; font-size: 32px; margin: 0 0 8px; }
  p { color: var(--dim); }
  a { color: var(--accent); }
  footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14px; color: var(--dim); }
</style>
</head>
<body>
<main>
  <h1>Agentic OS</h1>
  <p>A personal tool that shows its owner's own Google Tasks on his own dashboard (a PC and his phone).
  It isn't a public service and isn't offered to anyone else.</p>
  <p>It only reads tasks. It never creates, changes or deletes them.</p>
  <footer><a href="privacy.html">Privacy policy</a> · <a href="https://github.com/Twedderburn">Contact on GitHub</a></footer>
</main>
</body>
</html>
